<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
  <title id="title">The 2026-10 merge leak, before and after</title>
  <desc id="desc">Before the fix, two distinct matches between the same players were joined to odds by year and players within a 15-day window, then deduplicated on a key that collapsed both matches. The surviving row could carry the other match's odds, and h2h_ratio encoded the current result. After the fix, each match receives at most one odds line, chosen by nearest date, with a sets-won identity check and a dedup on the real match key.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
  </defs>

  <rect width="1100" height="560" fill="#ffffff"/>
  <text x="32" y="38" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">The 2026-10 leak: one bad join, two very different datasets</text>
  <text x="32" y="60" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#475569">The model did not beat the market. The merge handed it the answer.</text>

  <!-- BEFORE -->
  <rect x="24" y="86" width="512" height="300" rx="14" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="44" y="116" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#991b1b">Before: many-to-many on year + players</text>
  <text x="44" y="138" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#7f1d1d">Same two players, two matches days apart, one odds line.</text>

  <rect x="44" y="158" width="210" height="52" rx="8" fill="#ffffff" stroke="#f87171"/>
  <text x="56" y="179" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Match A · R16 · 2023-05-09</text>
  <text x="56" y="197" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#475569">score 6-4 6-3</text>

  <rect x="44" y="220" width="210" height="52" rx="8" fill="#ffffff" stroke="#f87171"/>
  <text x="56" y="241" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Match B · QF · 2023-05-11</text>
  <text x="56" y="259" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#475569">score 6-7 6-4 6-2</text>

  <rect x="300" y="188" width="210" height="52" rx="8" fill="#ffffff" stroke="#f87171"/>
  <text x="312" y="209" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Odds line · 2023-05-11</text>
  <text x="312" y="227" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#475569">opening 1.72 / 2.10</text>

  <line x1="254" y1="184" x2="300" y2="200" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="254" y1="246" x2="300" y2="228" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="262" y="180" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#991b1b">both join</text>

  <rect x="44" y="292" width="466" height="72" rx="8" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
  <text x="58" y="315" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#991b1b">drop_duplicates(Date, winner, loser)</text>
  <text x="58" y="334" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#7f1d1d">One row survives; it can carry the other match's odds.</text>
  <text x="58" y="351" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#7f1d1d">h2h_ratio now sees the current result: corr +0.336.</text>

  <!-- AFTER -->
  <rect x="564" y="86" width="512" height="300" rx="14" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="584" y="116" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#166534">After: one-to-one, nearest date + identity</text>
  <text x="584" y="138" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#14532d">Each match gets at most one odds line; each line feeds one match.</text>

  <rect x="584" y="158" width="200" height="52" rx="8" fill="#ffffff" stroke="#22c55e"/>
  <text x="596" y="179" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Match A · 2023-05-09</text>
  <text x="596" y="197" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#475569">odds 2023-05-09</text>

  <rect x="584" y="220" width="200" height="52" rx="8" fill="#ffffff" stroke="#22c55e"/>
  <text x="596" y="241" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Match B · 2023-05-11</text>
  <text x="596" y="259" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#475569">odds 2023-05-11</text>

  <rect x="828" y="158" width="220" height="52" rx="8" fill="#ffffff" stroke="#22c55e"/>
  <text x="840" y="179" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Odds A · 2023-05-09</text>
  <text x="840" y="197" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#475569">1.72 / 2.10</text>

  <rect x="828" y="220" width="220" height="52" rx="8" fill="#ffffff" stroke="#22c55e"/>
  <text x="840" y="241" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Odds B · 2023-05-11</text>
  <text x="840" y="259" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#475569">1.58 / 2.35</text>

  <line x1="784" y1="184" x2="828" y2="184" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="784" y1="246" x2="828" y2="246" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="708" y="180" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#166534">same day</text>
  <text x="708" y="270" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#166534">same day</text>

  <rect x="584" y="292" width="464" height="72" rx="8" fill="#ffffff" stroke="#22c55e" stroke-width="2"/>
  <text x="598" y="315" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#166534">identity check: sets won by the winner</text>
  <text x="598" y="334" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#14532d">R16 6-4 6-3 = 2 sets, QF 6-7 6-4 6-2 = 2 sets; the</text>
  <text x="598" y="351" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#14532d">date still separates them. Dedup on the real key.</text>

  <!-- Metrics -->
  <rect x="24" y="410" width="1052" height="112" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="44" y="438" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">The numbers that moved</text>
  <text x="44" y="462" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#475569">Leaked dataset → repaired dataset, same audit script.</text>

  <text x="44" y="492" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b">duplicate rows</text>
  <text x="44" y="510" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#991b1b">1,579 → <tspan fill="#166534">0</tspan></text>

  <text x="250" y="492" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b">corr(h2h, outcome)</text>
  <text x="250" y="510" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#991b1b">+0.336 → <tspan fill="#166534">+0.0938</tspan></text>

  <text x="500" y="492" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b">market Brier (2018+)</text>
  <text x="500" y="510" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">0.1974 → <tspan fill="#0f172a">0.2037</tspan></text>

  <text x="760" y="492" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b">model Brier (repaired: logged bets)</text>
  <text x="760" y="510" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#991b1b">0.1909 → <tspan fill="#166534">0.2373</tspan></text>

  <text x="32" y="546" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#64748b">Sources: data_pipeline.py:smart_merge(); verify_leak_fix.py; leak_checks.py. Historical values are from the pre-fix run; repaired values from the 2026-11 run. The repaired model Brier is measured on the 1,825 logged bets, where the market scores 0.2186.</text>
</svg>
